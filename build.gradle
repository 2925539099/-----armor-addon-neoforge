plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// 仓库镜像 + Mojang 下载重写代理（详见脚本内注释）
apply from: 'gradle/mojang-mirror.gradle'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// 源码包只用于在 IDE 里阅读源码，绝不能被当成模组：
//
// 1) 剔除 neoforge.mods.toml。否则 NeoForge 会把源码包识别为模组，而其中的
//    ${version} 占位符没有经过 processResources 展开，会直接抛出
//    "Illegal version number specified version"，让整个游戏进入
//    broken mod state —— 之后所有模组事件都被拒绝派发，其他模组（例如
//    ReplayMod）会因拿不到初始化事件而在后续 tick 崩溃。
// 2) 输出到 build/libs/sources/，避免与模组本体混在同一目录被误放进 mods/。
tasks.named('sourcesJar', Jar) {
    exclude 'META-INF/neoforge.mods.toml'
    destinationDirectory.set(layout.buildDirectory.dir('libs/sources'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "armor_addon" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }

    // MCreator 协作：MCreator 工作区的贴图目录是指向本项目的目录联接，
    // 因此这里的贴图目录里会混有 MCreator 旧元素的贴图（ymkj / ce_shi__ 等）。
    // 它们不属于本模组，打包时排除，避免混进 jar。
    exclude 'assets/armor_addon/textures/item/ce_shi__*.png'
    exclude 'assets/armor_addon/textures/item/ymkj_*.png'
    exclude 'assets/armor_addon/textures/item/ym.png'
    exclude 'assets/armor_addon/textures/item/tokui.png'
    exclude 'assets/armor_addon/textures/models/armor/ce_shi__*.png'
    exclude 'assets/armor_addon/textures/models/armor/ymkj_*.png'
}
